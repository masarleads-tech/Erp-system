name: Build Windows installer
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - run: copy dist\Basita-Setup.exe dist\Basita-Setup-1.0.0.exe
        shell: cmd
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: Basita ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          files: dist/*.exe
